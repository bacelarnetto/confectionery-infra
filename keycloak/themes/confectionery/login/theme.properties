# Tema de login da confeitaria -- herda todo o markup do tema padrão do Keycloak 26
# (keycloak.v2 / PatternFly) e só sobrescreve a identidade visual (branding + paleta âmbar).
parent=keycloak.v2
import=common/keycloak

# styles.css (do pai) primeiro, depois as sobreescritas da confeitaria. O Keycloak resolve
# recursos não encontrados no tema filho pelo tema pai, então css/styles.css cai no da v2.
styles=css/styles.css css/confectionery.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css

locale=en